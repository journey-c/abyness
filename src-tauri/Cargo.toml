[package]
name = "abyness"
version = "0.1.0"
description = "像素级复刻 Typora 的所见即所得 Markdown 编辑器"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "abyness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

# macOS:抑制系统自动注入「编辑」菜单的 开始听写 / 表情与符号(NSUserDefaults),
# 以及 WebKit 启动后注入的 AutoFill 子菜单(运行时从菜单里移除)。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSString",
  "NSUserDefaults",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
] }
